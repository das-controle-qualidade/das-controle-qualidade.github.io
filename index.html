<script>
/* ===== Leitor/gravador XLSX embutido (funciona offline, sem bibliotecas externas) ===== */
var XLSX=(function(){
 var enc=new TextEncoder(),dec=new TextDecoder('utf-8');

 function xml(s){return new DOMParser().parseFromString(s,'text/xml')}

       if(t==='s')v=ss[+raw];else if(t==='str')v=raw;else if(t==='b')v=raw==='1';else if(t==='e')v=null;

    var sheetRels=relMap(rels[rid]),sheetPath=rels[rid],sheetXml=txt(f,sheetPath),dr=sheetXml?tags(xml(sheetXml),'drawing')[0]:null;
    if(dr){var drid=dr.getAttribute('r:id')||dr.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id'),drawPath=sheetRels[drid];if(drawPath&&txt(f,drawPath)){var dxml=xml(txt(f,drawPath)),drels=relMap(drawPath),images={};tags(dxml,'twoCellAnchor').concat(tags(dxml,'oneCellAnchor')).forEach(function(an){var fr=tags(an,'from')[0],pic=tags(an,'pic')[0];if(!fr||!pic)return;var rowNode=tags(fr,'row')[0],colNode=tags(fr,'col')[0],blip=tags(pic,'blip')[0];if(!rowNode||!blip)return;var rid2=blip.getAttribute('r:embed')||blip.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','embed'),imgPath=drels[rid2],bytes=imgPath&&f[imgPath];if(!bytes)return;var ext=(imgPath.split('.').pop()||'png').toLowerCase(),mime=ext==='jpg'||ext==='jpeg'?'image/jpeg':ext==='gif'?'image/gif':ext==='webp'?'image/webp':'image/png',rowNo=+rowNode.textContent;if(!images[rowNo])images[rowNo]='data:'+mime+';base64,'+b64(bytes)});out.ImagesBySheetRow[name]=images}}
   });
   richPics(f,out,vmc);return out})}

  var rows=[],row=[],cur='',q=false;
  for(var i=0;i<text.length;i++){var ch=text[i];
   if(q){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
   else if(ch==='"')q=true;else if(ch===d){row.push(cur);cur=''}
   else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cur);rows.push(row);row=[];cur=''}

  if(b[0]===0xD0&&b[1]===0xCF)return Promise.reject(new Error('Formato .xls antigo não é suportado offline. Abra no Excel e salve como .xlsx.'));

<style>
:root{--bg:#eef1f5;--card:#fff;--ink:#1a2433;--mut:#5d6b7d;--line:#dde3ea;--pri:#1f4e79;--pri2:#2d6aa0;--ng:#c0392b;--re:#d68910;--ok:#1e8449;--side:#1f4e79;--sidei:#dbe7f3;--soft:#f6f8fa;--cum:#2c3e50;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.app{display:flex;min-height:100vh}
aside{width:210px;background:var(--side);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;flex-shrink:0}
aside .brand{padding:16px;border-bottom:1px solid rgba(255,255,255,.15)}
aside .brand small{display:block;font-size:11px;letter-spacing:.08em;color:var(--sidei)}
aside .brand b{font-size:20px}
aside nav{padding:10px;display:flex;flex-direction:column;gap:3px;flex:1;overflow:auto}
aside nav button{background:none;border:0;color:var(--sidei);text-align:left;padding:9px 12px;border-radius:7px;font:inherit;cursor:pointer}
aside nav button:hover{background:rgba(255,255,255,.1)}
aside nav button.on{background:#fff;color:#1f4e79;font-weight:600}
aside .foot{padding:12px;font-size:11px;color:var(--sidei);border-top:1px solid rgba(255,255,255,.15)}
main{flex:1;min-width:0;padding:18px 22px 40px}
h1{margin:0;font-size:22px}
.sub{color:var(--mut);margin:2px 0 14px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.menu-btn{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--pri);border-radius:8px;padding:10px 12px}
.kpi.ng{border-left-color:var(--ng)}.kpi.re{border-left-color:var(--re)}.kpi.ok{border-left-color:var(--ok)}
.kpi span{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.03em}
.kpi b{display:block;font-size:22px;margin-top:2px}
.kpi b.sm{font-size:14px;line-height:1.3;padding-top:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
button,select,input,textarea{font:inherit;color:var(--ink)}
.btn{background:var(--card);border:1px solid var(--line);border-radius:7px;padding:7px 12px;cursor:pointer}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.dan{background:var(--ng);border-color:var(--ng);color:#fff}
.btn.sm{padding:3px 8px;font-size:12px}
.btn:disabled{opacity:.4;cursor:default}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
input[type=text],input[type=date],input[type=number],select,textarea{background:var(--card);border:1px solid var(--line);border-radius:7px;padding:7px 9px;max-width:100%}
.search{flex:1;min-width:200px}
.flt{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.flt label,.frm label{display:flex;flex-direction:column;font-size:11px;color:var(--mut);gap:3px}
.flt select,.flt input{width:100%}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:5px 14px;cursor:pointer}
.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.tw{overflow:auto;max-height:560px;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 9px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
td.wrap{white-space:normal;min-width:160px}
th{background:var(--soft);position:sticky;top:0;font-size:11px;text-transform:uppercase;color:var(--mut);cursor:pointer;z-index:1}
td.n,th.n{text-align:right}
td.ngc{color:var(--ng);font-weight:600;text-align:right}td.rec{color:var(--re);font-weight:600;text-align:right}
tr.click{cursor:pointer}tr.click:hover td{background:var(--soft)}
.chart{overflow-x:auto}
.chart svg{display:block}
.empty{padding:30px;text-align:center;color:var(--mut)}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:8px;color:var(--mut)}
.modal-bg{position:fixed;inset:0;background:rgba(10,18,30,.55);display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto;z-index:50}
.modal{background:var(--card);border-radius:12px;padding:18px;width:min(720px,100%);border:1px solid var(--line)}
.modal.wide{width:min(980px,100%)}
.modal h2{margin:0 0 12px;font-size:18px}
.frm{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.frm .full{grid-column:1/-1}.frm input,.frm select,.frm textarea{width:100%}
.mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.chip{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:600}
.chip.ng{background:rgba(192,57,43,.14);color:var(--ng)}.chip.re{background:rgba(214,137,16,.16);color:var(--re)}.chip.both{background:rgba(31,78,121,.14);color:var(--pri)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mut);margin-bottom:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1a2433;color:#fff;padding:9px 16px;border-radius:8px;z-index:99;font-size:13px}
.note{font-size:12px;color:var(--mut)}
.warn{background:rgba(214,137,16,.12);border:1px solid var(--re);border-radius:8px;padding:8px 10px;font-size:12px;margin-top:8px}
.mrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:12px}
.mrow button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px;cursor:pointer;text-align:left}
.mrow button.on{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri) inset}
.mrow b{display:block}.mrow span{font-size:11px;color:var(--mut)}
.rpt-head{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:flex-end;border-bottom:3px solid var(--pri);padding-bottom:8px;margin-bottom:14px}
@media (max-width:900px){
 aside{position:fixed;left:-230px;z-index:40;transition:left .2s;width:220px}
 aside.open{left:0}
 .menu-btn{display:inline-block}
 main{padding:12px}
 .grid2{grid-template-columns:1fr}
 .frm{grid-template-columns:1fr}
}
@media print{
 aside,.noprint,.menu-btn,.toast{display:none!important}
 body,html{background:#fff;color:#000}
 main{padding:0}
 .card,.kpi{break-inside:avoid;border-color:#bbb}
 .tw{max-height:none;overflow:visible}
 .chart{overflow:visible}
}
#login{position:fixed;inset:0;z-index:200;background:radial-gradient(ellipse at 18% 20%,rgba(0,105,206,.68),transparent 44%),radial-gradient(ellipse at 84% 72%,rgba(22,139,178,.26),transparent 42%),linear-gradient(135deg,#050b12,#0b2030 52%,#06121e);align-items:center;justify-content:center;padding:16px;overflow:auto}
.lbox{width:min(440px,100%);background:rgba(9,24,38,.86);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(164,225,245,.42);border-radius:20px;padding:28px 30px;display:flex;flex-direction:column;gap:10px;color:#f4f8fc;box-shadow:0 24px 70px rgba(0,0,0,.45),inset 0 1px rgba(255,255,255,.14)}
.lbox label{display:flex;flex-direction:column;font-size:12px;color:#d4e3ed;gap:5px}.lbox input,.lbox select{width:100%;background:rgba(225,239,248,.14);border:1px solid rgba(210,232,245,.38);border-radius:7px;padding:9px 10px;color:#f7fbff}
.lbox select option{color:#172536;background:#fff}.lbox .note{color:#b8ccda}.lbox .btn.pri{background:linear-gradient(110deg,#087fa5,#1669ba);border-color:#66c8ed;box-shadow:0 0 22px rgba(42,180,230,.28);font-weight:700;padding:10px}
.das-logo{display:block;width:100%;max-width:150px;height:auto;max-height:62px;object-fit:contain;margin:0 auto 8px}.brand{display:flex;flex-direction:column;align-items:flex-start;gap:0}.brand .das-logo{margin:0 auto 8px;max-width:150px;max-height:58px}.lbox .das-logo{max-width:210px;max-height:90px;margin:0 auto 12px}
@media(max-width:480px){.lbox{padding:22px 18px}}.thumb{width:44px;height:34px;object-fit:cover;border-radius:5px;border:1px solid var(--line);cursor:zoom-in;vertical-align:middle}
.thumb.big{width:100%;max-width:240px;height:auto;max-height:180px;cursor:default}

.eqrow{display:grid;grid-template-columns:22px minmax(70px,1.2fr) 2fr 56px;gap:2px 8px;align-items:center;margin:8px 0;font-size:13px}
.eqrow>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.eqrow>b:last-child{text-align:right}
.eqrow small{grid-column:2/-1;color:var(--mut);font-size:11px}
.eqbar{display:flex;background:var(--soft);border-radius:4px;height:14px;overflow:hidden}.eqbar i{display:block;height:14px}
.kpi.nm b{font-size:17px;line-height:1.25;word-break:break-word}.kpi.nm small{display:block;color:var(--mut);font-size:12px;margin-top:4px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.fcard{border:1px solid var(--line);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:4px;background:var(--card)}
.fth{width:100%;height:100px;object-fit:cover;border-radius:6px;cursor:zoom-in}.fcard b{font-size:13px;word-break:break-word}.fcard small{color:var(--mut);font-size:11px;word-break:break-word}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{--k1:#1d4f91;--k2:#2f6fc0;position:relative;overflow:hidden;border:0;border-radius:12px;padding:14px 16px 13px;color:#fff;background:linear-gradient(135deg,var(--k1) 0%,var(--k2) 100%);box-shadow:0 6px 16px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.2);transition:transform .15s,box-shadow .15s;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.kpi:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.2)}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:rgba(255,255,255,.38)}
.kpi::after{content:"";position:absolute;right:-22px;top:-22px;width:92px;height:92px;border-radius:50%;background:rgba(255,255,255,.12);pointer-events:none}
.kpi span{position:relative;color:rgba(255,255,255,.93);font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase}
.kpi b{position:relative;color:#fff;font-size:28px;font-weight:800;line-height:1.1;margin-top:6px;text-shadow:0 1px 2px rgba(0,0,0,.2)}
.kpi b.sm{font-size:15px;line-height:1.3;padding-top:8px;font-weight:700}
.kpi.ng{--k1:#a4262c;--k2:#d9453d}.kpi.re{--k1:#a14d06;--k2:#d07d12}.kpi.ok{--k1:#176b41;--k2:#2a9d63}
.kpi.c2{--k1:#0e6573;--k2:#1795a6}.kpi.c5{--k1:#5a3796;--k2:#7e57c2}.kpi.c6{--k1:#33408f;--k2:#5565c4}.kpi.c7{--k1:#37474f;--k2:#5d7480}
.kpi.nm b{font-size:19px;line-height:1.25}.kpi.nm small{color:rgba(255,255,255,.93)}
.srcchips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.srcchip{display:inline-flex;gap:6px;align-items:center;padding:4px 11px;border-radius:999px;background:var(--soft);border:1px solid var(--line);font-size:12px;color:var(--ink)}
.srcchip b{color:var(--pri)}.srcchip.tot{background:var(--pri);border-color:var(--pri);color:#fff}.srcchip.tot b{color:#fff}
</style>
</head>

function nf(n){return Number(n||0).toLocaleString('pt-BR')}
function pf(n){return (n).toFixed(1).replace('.',',')+'%'}
function fd(iso){if(!iso)return '—';var p=iso.split('-');return p[2]+'/'+p[1]+'/'+p[0]}

/* ===== IndexedDB ===== */
var DB=null;
function dbOpen(){return new Promise(function(res,rej){
 try{var r=indexedDB.open('gp12db',1);
 r.onupgradeneeded=function(){var d=r.result;d.createObjectStore('records',{keyPath:'id'});d.createObjectStore('meta',{keyPath:'k'})};
 r.onsuccess=function(){DB=r.result;res()};r.onerror=function(){rej(r.error)}}catch(e){rej(e)}})}
function dbAll(){return new Promise(function(res,rej){var q=DB.transaction('records').objectStore('records').getAll();q.onsuccess=function(){res(q.result)};q.onerror=function(){rej(q.error)}})}
function dbMeta(k){return new Promise(function(res){var q=DB.transaction('meta').objectStore('meta').get(k);q.onsuccess=function(){res(q.result?q.result.v:null)};q.onerror=function(){res(null)}})}
function dbSetMeta(k,v){return new Promise(function(res,rej){try{var t=DB.transaction('meta','readwrite');t.objectStore('meta').put({k:k,v:v});t.oncomplete=res;t.onerror=function(){rej(t.error||new Error('Falha ao salvar metadados'))};t.onabort=function(){rej(t.error||new Error('Salvamento cancelado'))}}catch(e){rej(e)}})}
function dbPut(list){return new Promise(function(res,rej){if(!DB||memMode){rej(new Error('O banco de dados local não está disponível.'));return}var t;try{t=DB.transaction('records','readwrite');var st=t.objectStore('records');list.forEach(function(x){st.put(x)});t.oncomplete=function(){res()};t.onerror=function(){rej(t.error||new Error('Erro na gravação IndexedDB'))};t.onabort=function(){rej(t.error||new Error('A gravação foi cancelada pelo navegador'))}}catch(e){rej(e)}})}
function dbDel(id){return new Promise(function(res,rej){var t=DB.transaction('records','readwrite');t.objectStore('records').delete(id);t.oncomplete=res;t.onerror=function(){rej(t.error)}})}
function dbClear(){return new Promise(function(res,rej){var t=DB.transaction('records','readwrite');t.objectStore('records').clear();t.oncomplete=res;t.onerror=function(){rej(t.error)}})}
function dbDelMany(ids){return new Promise(function(res,rej){if(!ids.length){res();return}var t=DB.transaction('records','readwrite'),st=t.objectStore('records');ids.forEach(function(id){st.delete(id)});t.oncomplete=res;t.onerror=function(){rej(t.error)}})}
var memMode=false;

function recordTabId(r){return r&&r.tabId?r.tabId:'main'}
function recordsForTab(id){return S.recs.filter(function(r){return recordTabId(r)===(id||'main')})}
function tabIdForPage(page){page=page||S.page;return page.indexOf('regtab:')===0?page.slice(7):'main'}
function currentTab(){var id=tabIdForPage(S.page);return id==='main'?null:(S.regTabs||[]).filter(function(t){return t.id===id})[0]||null}
function activeBase(){return recordsForTab(S.activeTabId||'main')}
function newTabId(){return 'reg_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7)}
function nextId(){var m=0;S.recs.forEach(function(r){if(+r.id>m)m=+r.id});return m+1}
function save(list){if(memMode){var e=new Error('O armazenamento persistente está indisponível neste navegador. Os dados não foram salvos. Abra o sistema em um navegador normal, não em visualização/preview, e tente novamente.');toast(e.message);return Promise.reject(e)}return dbPut(list).catch(function(e){var msg=(e&&e.name==='QuotaExceededError')?'O armazenamento do navegador está cheio. Exporte um backup e libere espaço.':'Não foi possível gravar os dados no navegador: '+((e&&e.message)||'erro desconhecido')+'. Exporte um backup antes de tentar novamente.';toast(msg);return Promise.reject(e||new Error(msg))})}

/* ===== Filtros ===== */
function tipoOf(r){return r.ng>0&&r.re>0?'NG+RE':(r.ng>0?'NG':(r.re>0?'RE':'—'))}
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
 function filtered(baseList){
  var f=S.f,q=norm(f.q||''),base=baseList||S.viewRecs||recordsForTab('main');
  return base.filter(function(r){
   if(f.d1&&r.date<f.d1)return false;if(f.d2&&r.date>f.d2)return false;
   if(f.ano&&r.date.slice(0,4)!==f.ano)return false;
   if(f.mes&&parseInt(r.date.slice(5,7),10)!==+f.mes)return false;
   if(f.sem&&weekOf(r.date)!==+f.sem)return false;
   if(f.dia&&parseInt(r.date.slice(8,10),10)!==+f.dia)return false;
   if(f.code&&r.code!==f.code)return false;if(f.model&&r.model!==f.model)return false;if(f.problem&&r.problem!==f.problem)return false;
   if(f.turno&&r.turno!==f.turno)return false;if(f.local&&r.local!==f.local)return false;if(f.insp&&r.insp!==f.insp)return false;if(f.maquina&&r.maquina!==f.maquina)return false;if(f.operador&&r.operador!==f.operador)return false;if(f.soldador&&r.soldador!==f.soldador)return false;
   if(f.tipo){var t=tipoOf(r);if(f.tipo==='NG'&&!(r.ng>0))return false;if(f.tipo==='RE'&&!(r.re>0))return false;if(f.tipo==='NG+RE'&&t!=='NG+RE')return false}
   if(f.ngmin!==undefined&&f.ngmin!==''&&r.ng<+f.ngmin)return false;
   if(f.remin!==undefined&&f.remin!==''&&r.re<+f.remin)return false;
   if(f.qmin!==undefined&&f.qmin!==''&&(r.ng+r.re)<+f.qmin)return false;
   if(q){var hay=norm([r.code,r.model,r.problem,fd(r.date),r.date,r.ng,r.re,r.turno,r.insp,r.local,r.operador,r.soldador,r.maquina,r.obs,(r.ng>0?'scrap ng':''),(r.re>0?'rework re retrabalho':'')].join(' '));if(hay.indexOf(q)<0)return false}
   return true})}
function uniq(k){var m={};(S.viewRecs||recordsForTab('main')).forEach(function(r){if(r[k])m[r[k]]=1});return Object.keys(m).sort(function(a,b){return a.localeCompare(b,'pt')})}
function tipoLabel(t){return t==='NG'?'Scrap':t==='RE'?'Rework':t==='NG+RE'?'Scrap + Rework':'—'}

/* ===== Agregações ===== */
function sum(rs){var o={n:rs.length,ng:0,re:0};rs.forEach(function(r){o.ng+=r.ng;o.re+=r.re});o.tot=o.ng+o.re;return o}
function groupBy(rs,fn){var m={};rs.forEach(function(r){var k=fn(r);var o=m[k]||(m[k]={k:k,n:0,ng:0,re:0,tot:0});o.n++;o.ng+=r.ng;o.re+=r.re;o.tot+=r.ng+r.re});return Object.keys(m).map(function(k){return m[k]})}
function periodKey(g){return function(r){var d=r.date;if(g==='day')return d;if(g==='week')return d.slice(0,7)+'-S'+weekOf(d);if(g==='month')return d.slice(0,7);return d.slice(0,4)}}
function periodLabel(g,k){if(g==='day')return k.slice(8)+'/'+k.slice(5,7);if(g==='week')return 'S'+k.slice(-1)+' '+MS[+k.slice(5,7)-1];if(g==='month')return MS[+k.slice(5,7)-1]+'/'+k.slice(2,4);return k}
function series(rs,g){return groupBy(rs,periodKey(g)).sort(function(a,b){return a.k<b.k?-1:1})}
function pareto(rs,keyfn,metric){
 var a=groupBy(rs,keyfn).map(function(o){o.v=metric==='ng'?o.ng:metric==='re'?o.re:o.tot;return o}).filter(function(o){return o.v>0}).sort(function(a,b){return b.v-a.v});
 var t=0;a.forEach(function(o){t+=o.v});var c=0;a.forEach(function(o){o.p=t?o.v/t*100:0;c+=o.v;o.c=t?c/t*100:0});return {rows:a,total:t}}

/* ===== Gráficos SVG ===== */
var C={ng:'var(--ng)',re:'var(--re)',tot:'var(--pri)',cum:'var(--cum)'};
function niceMax(v){if(v<=0)return 1;var p=Math.pow(10,Math.floor(Math.log10(v)));var m=v/p;var n=m<=1?1:m<=2?2:m<=5?5:10;return n*p}
function short(s,n){s=String(s);return s.length>n?s.slice(0,n-1)+'…':s}
function barChart(data,opt){
 /* data: [{label,ng,re,tot}] ; opt.mode 'group' | 'stack' | 'tot' */
 if(!data.length)return '<div class="empty">Sem dados para os filtros selecionados.</div>';
 var mode=opt.mode||'group',H=opt.h||280,pl=52,pr=12,pt=12,pb=opt.rot?70:34;
 var bw=opt.bw||(mode==='group'?26:16),gap=opt.gap||8;var step=(mode==='group'?bw*2:bw)+gap;
 var W=Math.max(opt.minW||560,pl+pr+data.length*step);
 var mx=0;data.forEach(function(d){var v=mode==='group'?Math.max(d.ng,d.re):mode==='stack'?d.ng+d.re:(d.v!=null?d.v:d.tot);if(v>mx)mx=v});
 var top=niceMax(mx),ih=H-pt-pb,s='';
 for(var i=0;i<=4;i++){var y=pt+ih-ih*i/4;s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)"/><text x="'+(pl-6)+'" y="'+(y+4)+'" text-anchor="end" font-size="10" fill="var(--mut)">'+nf(Math.round(top*i/4))+'</text>'}
 data.forEach(function(d,i){
  var x=pl+i*step+gap/2;var cx=x+(mode==='group'?bw:bw/2);
  function rect(xx,v,col,w,yoff,lab){var h=ih*v/top;return '<rect x="'+xx+'" y="'+(pt+ih-h-(yoff||0))+'" width="'+w+'" height="'+Math.max(h,0)+'" fill="'+col+'" rx="2"><title>'+esc(d.label)+' — '+lab+': '+nf(v)+'</title></rect>'}
  if(mode==='group'){s+=rect(x,d.ng,C.ng,bw,0,'Scrap')+rect(x+bw,d.re,C.re,bw,0,'Rework')}
  else if(mode==='stack'){s+=rect(x,d.ng,C.ng,bw,0,'Scrap')+rect(x,d.re,C.re,bw,ih*d.ng/top,'Rework')}
  else{s+=rect(x,d.v!=null?d.v:d.tot,opt.color||C.tot,bw,0,opt.name||'Total')}
  var lbl=opt.rot?'<text transform="translate('+cx+','+(H-pb+10)+') rotate(-50)" text-anchor="end" font-size="10" fill="var(--mut)">'+esc(short(d.label,22))+'</text>':'<text x="'+cx+'" y="'+(H-pb+14)+'" text-anchor="middle" font-size="10" fill="var(--mut)">'+esc(d.label)+'</text>';
  s+=lbl});
 return '<div class="chart"><svg style="width:100%;min-width:'+W+'px;height:auto" viewBox="0 0 '+W+' '+H+'" role="img">'+s+'</svg></div>'}
function paretoChart(rows){
 if(!rows.length)return '<div class="empty">Sem dados para os filtros selecionados.</div>';
 var n=Math.min(rows.length,20),d=rows.slice(0,n),H=360,pl=56,pr=48,pt=14,pb=120,bw=34,gap=14,step=bw+gap,W=Math.max(620,pl+pr+n*step),ih=H-pt-pb;
 var top=niceMax(d[0].v),s='';
 for(var i=0;i<=4;i++){var y=pt+ih-ih*i/4;s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)"/><text x="'+(pl-6)+'" y="'+(y+4)+'" text-anchor="end" font-size="10" fill="var(--mut)">'+nf(Math.round(top*i/4))+'</text><text x="'+(W-pr+6)+'" y="'+(y+4)+'" font-size="10" fill="var(--mut)">'+(i*25)+'%</text>'}
 var pts=[];
 d.forEach(function(o,i){var x=pl+i*step+gap/2,h=ih*o.v/top,cx=x+bw/2;
  s+='<rect x="'+x+'" y="'+(pt+ih-h)+'" width="'+bw+'" height="'+h+'" fill="var(--pri)" rx="2"><title>'+esc(o.k)+': '+nf(o.v)+' ('+pf(o.p)+')</title></rect>';
  s+='<text x="'+cx+'" y="'+(pt+ih-h-4)+'" text-anchor="middle" font-size="9" fill="var(--ink)">'+nf(o.v)+'</text>';
  var cy=pt+ih-ih*o.c/100;pts.push([cx,cy,o]);
  s+='<text transform="translate('+cx+','+(H-pb+10)+') rotate(-50)" text-anchor="end" font-size="10" fill="var(--mut)">'+esc(short(o.k,28))+'</text>'});
 s+='<polyline fill="none" stroke="var(--re)" stroke-width="2" points="'+pts.map(function(p){return p[0]+','+p[1]}).join(' ')+'"/>';
 pts.forEach(function(p){s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3.5" fill="var(--re)"><title>'+esc(p[2].k)+' — acumulado '+pf(p[2].c)+'</title></circle>'});
 return '<div class="legend"><span><i style="background:var(--pri)"></i>Quantidade</span><span><i style="background:var(--re)"></i>% acumulado</span>'+(rows.length>n?'<span>Exibindo os '+n+' maiores de '+rows.length+'</span>':'')+'</div><div class="chart"><svg style="width:100%;min-width:'+W+'px;height:auto" viewBox="0 0 '+W+' '+H+'">'+s+'</svg></div>'}
function hbars(rows,col){
 if(!rows.length)return '<div class="empty">Sem dados.</div>';var mx=rows[0].v||1;
 return rows.map(function(o,i){return '<div style="display:grid;grid-template-columns:22px minmax(80px,1.3fr) 2fr 70px;gap:8px;align-items:center;margin:5px 0;font-size:13px"><b style="color:var(--mut)">'+(i+1)+'</b><span title="'+esc(o.k)+'" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(o.k)+'</span><div style="background:var(--soft);border-radius:4px;height:14px"><div style="width:'+(o.v/mx*100)+'%;height:14px;border-radius:4px;background:'+col+'"></div></div><b style="text-align:right">'+nf(o.v)+'</b></div>'}).join('')}
function paretoTable(rows,clickKind){
 if(!rows.length)return '';
 return '<div class="tw"><table><thead><tr><th>#</th><th>Item</th><th class="n">Quantidade</th><th class="n">%</th><th class="n">% acumulado</th></tr></thead><tbody>'+rows.map(function(o,i){return '<tr class="click" data-det="'+clickKind+'" data-v="'+esc(o.k)+'"><td>'+(i+1)+'</td><td class="wrap">'+esc(o.k)+'</td><td class="n">'+nf(o.v)+'</td><td class="n">'+pf(o.p)+'</td><td class="n">'+pf(o.c)+'</td></tr>'}).join('')+'</tbody></table></div>'}
function modelRank(rs,metric,n){return pareto(rs,function(r){return r.model+' ['+r.code+']'},metric).rows.slice(0,n||10)}

/* ===== Filtros UI ===== */
function filterUI(){
 var f=S.f;function sel(k,lab,opts,fmt){return '<label>'+lab+'<select data-f="'+k+'"><option value="">Todos</option>'+opts.map(function(o){var v=Array.isArray(o)?o[0]:o,t=Array.isArray(o)?o[1]:o;return '<option value="'+esc(v)+'"'+(String(f[k])===String(v)?' selected':'')+'>'+esc(t)+'</option>'}).join('')+'</select></label>'}
 function inp(k,lab,type,ph){return '<label>'+lab+'<input data-f="'+k+'" type="'+type+'" value="'+esc(f[k]||'')+'" '+(ph?'placeholder="'+ph+'"':'')+'></label>'}
 var anos=[];(S.viewRecs||recordsForTab('main')).forEach(function(r){var y=r.date.slice(0,4);if(anos.indexOf(y)<0)anos.push(y)});anos.sort();
 var dias=[];for(var i=1;i<=31;i++)dias.push([i,i]);
 var h='<div class="card noprint"><div class="bar" style="margin-bottom:'+(S.showF?10:0)+'px"><input class="search" id="q" type="text" placeholder="PESQUISAR… (código, modelo, problema, data, Scrap, Rework)" value="'+esc(f.q||'')+'">'
  +'<button class="btn" data-act="toggleF">'+(S.showF?'Ocultar filtros':'Filtros avançados')+'</button><button class="btn" data-act="clearF">Limpar filtros</button></div>';
 if(S.showF){h+='<div class="flt">'+inp('d1','Data inicial','date')+inp('d2','Data final','date')
  +sel('ano','Ano',anos)+sel('mes','Mês',MESES.map(function(m,i){return [i+1,m]}))+sel('sem','Semana do mês',[1,2,3,4,5].map(function(w){return [w,'Semana '+w]}))+sel('dia','Dia',dias)
  +sel('code','Código',uniq('code'))+sel('model','Modelo',uniq('model'))+sel('problem','Problema',uniq('problem'))
  +sel('tipo','Tipo',[['NG','Com Scrap'],['RE','Com Rework'],['NG+RE','Scrap e Rework']])
  +inp('ngmin','Scrap mínimo','number','0')+inp('remin','Rework mínimo','number','0')+inp('qmin','Quantidade mínima (Scrap + Rework)','number','0')
  +sel('local','Local de inspeção',uniq('local'))+sel('turno','Turno',uniq('turno'))+sel('insp','Inspetor',uniq('insp'))+sel('maquina','Máquina',uniq('maquina'))+sel('operador','Operador',uniq('operador'))+sel('soldador','Soldador',uniq('soldador'))+'</div>'}
 return h+'</div>'}
function activeFilterText(){var f=S.f,p=[];if(f.d1||f.d2)p.push('Período '+fd(f.d1)+' a '+fd(f.d2));if(f.ano)p.push('Ano '+f.ano);if(f.mes)p.push(MESES[f.mes-1]);if(f.sem)p.push('Semana '+f.sem);if(f.dia)p.push('Dia '+f.dia);if(f.code)p.push('Código '+f.code);if(f.model)p.push('Modelo '+f.model);if(f.problem)p.push('Problema '+f.problem);if(f.tipo)p.push('Tipo '+tipoLabel(f.tipo));if(f.q)p.push('Busca "'+f.q+'"');return p.length?p.join(' · '):'Sem filtros (todos os registros)'}
function periodText(rs){if(!rs.length)return '—';var a=rs[0].date,b=rs[0].date;rs.forEach(function(r){if(r.date<a)a=r.date;if(r.date>b)b=r.date});return fd(a)+' – '+fd(b)}

/* ===== Páginas ===== */
function dashSrcId(){var s=S.dashSrc||'all';return (s==='all'||tabsAll().some(function(t){return t.id===s}))?s:'all'}
function dashRecs(){var s=dashSrcId();return s==='all'?S.recs:recordsForTab(s)}
function dashSrcBar(){var cur=dashSrcId(),ls='display:flex;flex-direction:column;font-size:11px;color:var(--mut);gap:3px';
 return '<div class="card noprint"><div class="bar" style="align-items:flex-end"><label style="'+ls+'">Fonte dos dados<select id="dash_src"><option value="all"'+(cur==='all'?' selected':'')+'>Todas as abas (consolidado)</option>'+tabsAll().map(function(t){return '<option value="'+esc(t.id)+'"'+(cur===t.id?' selected':'')+'>'+esc(t.name)+'</option>'}).join('')+'</select></label><div class="srcchips">'+tabsAll().map(function(t){return '<span class="srcchip">'+esc(t.name)+' <b>'+nf(recordsForTab(t.id).length)+'</b></span>'}).join('')+'<span class="srcchip tot">Total <b>'+nf(S.recs.length)+'</b></span></div></div></div>'}
function kpis(rs){
 var s=sum(rs),probs={},mods={},occ=0;rs.forEach(function(r){probs[r.problem]=1;mods[r.model+r.code]=1;if(r.ng+r.re>0)occ++});
 return '<div class="kpis"><div class="kpi"><span>Total de registros</span><b>'+nf(s.n)+'</b></div><div class="kpi c2"><span>Total de peças (Scrap + Rework)</span><b>'+nf(s.tot)+'</b></div><div class="kpi ng"><span>Total Scrap</span><b>'+nf(s.ng)+'</b></div><div class="kpi re"><span>Total Rework</span><b>'+nf(s.re)+'</b></div><div class="kpi c5"><span>Total de defeitos (ocorrências)</span><b>'+nf(occ)+'</b></div><div class="kpi c6"><span>Total de problemas</span><b>'+nf(Object.keys(probs).length)+'</b></div><div class="kpi c7"><span>Modelos afetados</span><b>'+nf(Object.keys(mods).length)+'</b></div><div class="kpi ok"><span>Período analisado</span><b class="sm">'+periodText(rs)+'</b></div></div>'}
function granTabs(key,cur){return '<div class="tabs noprint">'+[['day','Dia'],['week','Semana'],['month','Mês'],['year','Ano']].map(function(g){return '<button class="'+(cur===g[0]?'on':'')+'" data-gran="'+key+'" data-v="'+g[0]+'">'+g[1]+'</button>'}).join('')+'</div>'}
function legend(){return '<div class="legend"><span><i style="background:var(--ng)"></i>Scrap</span><span><i style="background:var(--re)"></i>Rework</span></div>'}

function periodTable(rs,g){

 function pDash(rs,title,opt){

/* ===== Análise por Máquina, Inspetor, Operador, Soldador e Turno ===== */
function titleCase(v){return v===v.toLowerCase()?v.replace(/(^|\s)(\S)/g,function(m,a,b){return a+b.toUpperCase()}):v}
function rankField(rs,keyfn){var seen={},blank=0;
 var all=groupBy(rs,function(r){var k=keyfn(r);if(!k)return '\u0000';var n=norm(k);return seen[n]||(seen[n]=titleCase(k))});
 all.forEach(function(o){if(o.k==='\u0000')blank=o.tot});
 return {rows:all.filter(function(o){return o.k!=='\u0000'&&o.tot>0}).sort(function(a,b){return b.tot-a.tot}),blank:blank}}
function fld(k){return function(r){return String(r[k]||'').trim()}}
function stackBars(rows,n){rows=rows.slice(0,n||10);if(!rows.length)return '<div class="empty">Sem dados informados neste campo.</div>';var mx=rows[0].tot||1;

  +'<div class="card"><h3>Peças com defeito por Máquina e turno</h3>'+stackBars(maqTurn.rows,10)+blankNote(maqTurn,'máquina/turno')+'</div></div>'

 function pReg(rs,opts){

function pPareto(rs){
 var m=S.pmetric,g=S.pgroup;var kf=g==='problem'?function(r){return r.problem}:g==='model'?function(r){return r.model}:function(r){return r.code};
 var p=pareto(rs,kf,m);var ml={tot:'Total (Scrap + Rework)',ng:'Scrap',re:'Rework'}[m];
 return '<div class="top"><div><h1>Pareto &amp; Rankings</h1><div class="sub">Identifique os problemas de maior impacto · '+esc(activeFilterText())+'</div></div></div>'+filterUI()
 +'<div class="card"><div class="tabs noprint">'+[['tot','Pareto de problemas (total)'],['ng','Pareto de Scrap'],['re','Pareto de Rework']].map(function(x){return '<button class="'+(m===x[0]?'on':'')+'" data-pm="'+x[0]+'">'+x[1]+'</button>'}).join('')
 +'<select data-pg2="1" class="noprint" style="margin-left:auto"><option value="problem"'+(g==='problem'?' selected':'')+'>Agrupar por Problema</option><option value="model"'+(g==='model'?' selected':'')+'>Agrupar por Modelo</option><option value="code"'+(g==='code'?' selected':'')+'>Agrupar por Código</option></select></div>'
 +'<h3>Pareto — '+ml+' · total '+nf(p.total)+'</h3>'+paretoChart(p.rows)+'</div>'
 +'<div class="card"><h3>Tabela de Pareto (clique para detalhar)</h3>'+paretoTable(p.rows,g)+'</div>'
 +'<div class="grid2"><div class="card"><h3>Modelos com mais Scrap</h3>'+hbars(modelRank(rs,'ng',10),'var(--ng)')+'</div><div class="card"><h3>Modelos com mais Rework</h3>'+hbars(modelRank(rs,'re',10),'var(--re)')+'</div></div>'
 +'<div class="grid2"><div class="card"><h3>Problemas mais frequentes (quantidade Scrap + Rework)</h3>'+hbars(pareto(rs,function(r){return r.problem},'tot').rows.slice(0,10).map(function(o){return {k:o.k,v:o.v}}),'var(--pri)')+'</div>'
 +'<div class="card"><h3>Defeitos mais frequentes (nº de ocorrências registradas)</h3>'+hbars(groupBy(rs.filter(function(r){return r.ng+r.re>0}),function(r){return r.problem}).sort(function(a,b){return b.n-a.n}).slice(0,10).map(function(o){return {k:o.k,v:o.n}}),'var(--pri2)')+'</div></div>'}

function imgScale(src,max,q){return new Promise(function(res,rej){var g=new Image();g.onload=function(){try{var k=Math.min(1,max/Math.max(g.width,g.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(g.width*k));c.height=Math.max(1,Math.round(g.height*k));var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(g,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))}catch(e){rej(e)}};g.onerror=function(){rej(new Error('imagem inválida'))};g.src=src})}
function fileToURL(f){return new Promise(function(res,rej){var rd=new FileReader();rd.onload=function(){res(rd.result)};rd.onerror=function(){rej(rd.error)};rd.readAsDataURL(f)})}

function libAddOne(o){if(o.id&&S.fotos.some(function(f){return f.id===o.id}))return Promise.resolve(null);
